# XcodeGen spec. Run `xcodegen` in this folder to generate CreditCardTracker.xcodeproj.
# (Install once with: brew install xcodegen)
name: CreditCardTracker

options:
  bundleIdPrefix: com.tariqe2000
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # iPhone only
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  CreditCardTracker:
    type: application
    platform: iOS
    sources:
      - CreditCardTracker
    settings:
      base:
        # Placeholder: change to your own bundle ID before signing in Xcode.
        PRODUCT_BUNDLE_IDENTIFIER: com.tariqe2000.creditcardtracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Credit Card Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  CreditCardTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CreditCardTrackerTests
    dependencies:
      - target: CreditCardTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tariqe2000.creditcardtracker.tests

schemes:
  CreditCardTracker:
    build:
      targets:
        CreditCardTracker: all
    test:
      targets:
        - CreditCardTrackerTests
